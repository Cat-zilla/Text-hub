# JVM memory is deliberately conservative so the build also works on small CI boxes.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
# Run the Kotlin compiler inside the Gradle daemon to save memory on constrained machines.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
org.gradle.workers.max=1
